              fun writeSectors(lba: Long, data: ByteArray): Boolean {
                  val driver = blockDevice ?: return false
                  return try {
                      val buf = ByteBuffer.wrap(data)
                      driver.write(lba, buf)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

