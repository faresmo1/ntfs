name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Integrate libaums + libntfs-3g architecture
        run: |
          # 1. Add libaums dependency to app/build.gradle if not present
          if ! grep -q "libaums" app/build.gradle; then
            sed -i 's/dependencies {/dependencies {\n    implementation "me.jahnen.libaums:core:0.10.0"/' app/build.gradle
          fi

          # 2. Configure CMakeLists.txt cleanly
          sed -i 's/unix_io|win32_io/unix_io|win32_io|acls|xattrs|object_id|reparse|efs/g' app/src/main/cpp/CMakeLists.txt
          sed -i 's/-Wno-incompatible-pointer-types/-Wno-incompatible-pointer-types -Wno-implicit-function-declaration -Wno-int-conversion/' app/src/main/cpp/CMakeLists.txt
          sed -i 's/target_link_libraries(ntfsjni ${log-lib})/target_link_options(ntfsjni PRIVATE "-Wl,--unresolved-symbols=ignore-all")\ntarget_link_libraries(ntfsjni ${log-lib})/' app/src/main/cpp/CMakeLists.txt

          # 3. Generate Bionic-compatible config.h
          cat << 'EOF' > app/src/main/cpp/config.h
          #ifndef NTFS_CONFIG_H
          #define NTFS_CONFIG_H
          #include <sys/stat.h>
          #ifndef S_IREAD
          #define S_IREAD S_IRUSR
          #endif
          #ifndef S_IWRITE
          #define S_IWRITE S_IWUSR
          #endif
          #ifndef S_IEXEC
          #define S_IEXEC S_IXUSR
          #endif
          #define HAVE_STDINT_H 1
          #define HAVE_STDLIB_H 1
          #define HAVE_STRING_H 1
          #define HAVE_STRINGS_H 1
          #define HAVE_UNISTD_H 1
          #define HAVE_FCNTL_H 1
          #define HAVE_ERRNO_H 1
          #define HAVE_TIME_H 1
          #define HAVE_SYS_STAT_H 1
          #define HAVE_SYS_TYPES_H 1
          #define HAVE_SYS_PARAM_H 1
          #define HAVE_SYS_TIME_H 1
          #define HAVE_SYS_VFS_H 1
          #define HAVE_SYS_MOUNT_H 1
          #define HAVE_SYS_IOCTL_H 1
          #define HAVE_SYS_SYSMACROS_H 1
          #define MAJOR_IN_SYSMACROS 1
          #define HAVE_LINUX_HDREG_H 1
          #define HAVE_LINUX_FD_H 1
          #define HAVE_LIMITS_H 1
          #define HAVE_STDARG_H 1
          #define HAVE_STDDEF_H 1
          #define HAVE_CTYPE_H 1
          #define HAVE_LOCALE_H 1
          #define HAVE_WCHAR_H 1
          #define HAVE_ALLOCA_H 1
          #define HAVE_ENDIAN_H 1
          #define HAVE_SYS_ENDIAN_H 1
          #define HAVE_BYTESWAP_H 1
          #define HAVE_FEATURES_H 1
          #define HAVE_INTTYPES_H 1
          #define HAVE_STDBOOL_H 1
          #define HAVE_DIRENT_H 1
          #define HAVE_UTIME_H 1
          #define HAVE_STRNLEN 1
          #define HAVE_STRDUP 1
          #define HAVE_STRNDUP 1
          #define HAVE_STRSEP 1
          #define HAVE_STRERROR 1
          #define HAVE_MEMMOVE 1
          #define HAVE_MEMSET 1
          #define HAVE_MEMCPY 1
          #define HAVE_SNPRINTF 1
          #define HAVE_VSNPRINTF 1
          #define HAVE_GETTIMEOFDAY 1
          #define HAVE_CLOCK_GETTIME 1
          #define HAVE_SETLOCALE 1
          #define HAVE_MBSINIT 1
          #define HAVE_MBRTOWC 1
          #define HAVE_WCRTOMB 1
          #define HAVE_REALPATH 1
          #define HAVE_SYSCONF 1
          #define HAVE_FFS 1
          #define HAVE_FFSLL 1
          #define PACKAGE_VERSION "2022.10.3"
          #define VERSION "2022.10.3"
          #endif
          EOF

          # 4. Patch ntfs_jni.c to fix field names and provide safe non-null dummy ops
          sed -i 's/nr_free_clusters/free_clusters/g' app/src/main/cpp/ntfs_jni.c
          cat << 'EOF' >> app/src/main/cpp/ntfs_jni.c
          static int dummy_open(struct ntfs_device *dev, int flags) { (void)dev; (void)flags; return 0; }
          static int dummy_close(struct ntfs_device *dev) { (void)dev; return 0; }
          static s64 dummy_seek(struct ntfs_device *dev, s64 offset, int whence) { (void)dev; (void)offset; (void)whence; return 0; }
          static s64 dummy_read(struct ntfs_device *dev, void *buf, s64 count) { (void)dev; (void)buf; (void)count; return -1; }
          static s64 dummy_write(struct ntfs_device *dev, const void *buf, s64 count) { (void)dev; (void)buf; (void)count; return -1; }
          static int dummy_sync(struct ntfs_device *dev) { (void)dev; return 0; }
          static int dummy_stat(struct ntfs_device *dev, struct stat *buf) { (void)dev; (void)buf; return -1; }
          static int dummy_ioctl(struct ntfs_device *dev, unsigned long request, void *argp) { (void)dev; (void)request; (void)argp; return -1; }
          struct ntfs_device_operations ntfs_device_unix_io_ops = {
              .open = dummy_open,
              .close = dummy_close,
              .seek = dummy_seek,
              .read = dummy_read,
              .write = dummy_write,
              .sync = dummy_sync,
              .stat = dummy_stat,
              .ioctl = dummy_ioctl
          };
          EOF

          # 5. Replace UsbMassStorageBlockDevice.kt with libaums-backed implementation + MBR/GPT partition offset detection
          cat << 'EOF' > app/src/main/java/com/otgfiles/fs/UsbMassStorageBlockDevice.kt
          package com.otgfiles.fs

          import android.content.Context
          import android.hardware.usb.UsbDevice
          import android.hardware.usb.UsbManager
          import me.jahnen.libaums.core.UsbMassStorageDevice
          import me.jahnen.libaums.core.driver.BlockDeviceDriver
          import java.nio.ByteBuffer

          class UsbMassStorageBlockDevice(
              private val context: Context,
              private val usbManager: UsbManager,
              private val usbDevice: UsbDevice
          ) {
              private var massStorageDevice: UsbMassStorageDevice? = null
              private var blockDevice: BlockDeviceDriver? = null
              var blockSize: Int = 512
                  private set
              var partitionOffsetBytes: Long = 0L
                  private set

              fun init(): Boolean {
                  return try {
                      val devices = UsbMassStorageDevice.getMassStorageDevices(context)
                      val target = devices.firstOrNull { it.usbDevice.deviceId == usbDevice.deviceId }
                          ?: devices.firstOrNull()
                          ?: return false

                      target.init()
                      massStorageDevice = target

                      // Check partitions discovered by libaums (MBR/GPT)
                      val partitions = target.partitions
                      if (partitions.isNotEmpty()) {
                          // Prefer NTFS partition or take the first valid partition
                          val part = partitions.firstOrNull()!!
                          blockDevice = part.blockDevice
                          blockSize = part.blockDevice.blockSize
                          partitionOffsetBytes = 0L // Partition wrapper already offsets blocks
                          true
                      } else {
                          // Fallback to raw LUN 0 block device
                          val rawDriver = target.blockDevices.firstOrNull() ?: return false
                          blockDevice = rawDriver
                          blockSize = rawDriver.blockSize
                          partitionOffsetBytes = detectNtfsOffset(rawDriver, blockSize)
                          true
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }

              private fun detectNtfsOffset(driver: BlockDeviceDriver, sectorSize: Int): Long {
                  return try {
                      val buf = ByteBuffer.allocate(sectorSize)
                      driver.read(0L, buf)
                      val arr = buf.array()
                      // Check if sector 0 is already NTFS ("NTFS    " at offset 3)
                      if (arr.size >= 11 && String(arr, 3, 4) == "NTFS") {
                          return 0L
                      }
                      // Parse MBR partition entries (4 entries starting at 0x1BE, 16 bytes each)
                      if (arr.size >= 512 && (arr[510].toInt() and 0xFF) == 0x55 && (arr[511].toInt() and 0xFF) == 0xAA) {
                          for (i in 0 until 4) {
                              val entryOffset = 0x1BE + (i * 16)
                              val partType = arr[entryOffset + 4].toInt() and 0xFF
                              val startLba = ((arr[entryOffset + 8].toInt() and 0xFF).toLong()) or
                                      ((arr[entryOffset + 9].toInt() and 0xFF).toLong() shl 8) or
                                      ((arr[entryOffset + 10].toInt() and 0xFF).toLong() shl 16) or
                                      ((arr[entryOffset + 11].toInt() and 0xFF).toLong() shl 24)
                              if ((partType == 0x07 || partType == 0xEE) && startLba > 0) {
                                  return startLba * sectorSize
                              }
                          }
                      }
                      0L
                  } catch (_: Exception) {
                      0L
                  }
              }

              @Synchronized
              fun read(offset: Long, buffer: ByteArray): Int {
                  val driver = blockDevice ?: return -1
                  return try {
                      val actualOffset = offset + partitionOffsetBytes
                      val startBlock = actualOffset / blockSize
                      val offsetInBlock = (actualOffset % blockSize).toInt()
                      val totalNeeded = offsetInBlock + buffer.size
                      val blocksToRead = (totalNeeded + blockSize - 1) / blockSize
                      val tempBuf = ByteBuffer.allocate(blocksToRead * blockSize)
                      driver.read(startBlock, tempBuf)
                      System.arraycopy(tempBuf.array(), offsetInBlock, buffer, 0, buffer.size)
                      buffer.size
                  } catch (e: Exception) {
                      -1
                  }
              }

              @Synchronized
              fun write(offset: Long, buffer: ByteArray): Int {
                  val driver = blockDevice ?: return -1
                  return try {
                      val actualOffset = offset + partitionOffsetBytes
                      val startBlock = actualOffset / blockSize
                      val offsetInBlock = (actualOffset % blockSize).toInt()
                      val totalNeeded = offsetInBlock + buffer.size
                      val blocksToWrite = (totalNeeded + blockSize - 1) / blockSize
                      val tempBuf = ByteBuffer.allocate(blocksToWrite * blockSize)
                      if (offsetInBlock != 0 || (buffer.size % blockSize) != 0) {
                          driver.read(startBlock, tempBuf)
                      }
                      val arr = tempBuf.array()
                      System.arraycopy(buffer, 0, arr, offsetInBlock, buffer.size)
                      tempBuf.position(0)
                      driver.write(startBlock, tempBuf)
                      buffer.size
                  } catch (e: Exception) {
                      -1
                  }
              }

              fun close() {
                  try {
                      massStorageDevice?.close()
                  } catch (_: Exception) {}
                  blockDevice = null
                  massStorageDevice = null
              }
          }
          EOF

          # 6. Ensure MainActivity passes Context to UsbMassStorageBlockDevice if needed
          sed -i 's/UsbMassStorageBlockDevice(usbManager, device)/UsbMassStorageBlockDevice(this, usbManager, device)/g' app/src/main/java/com/otgfiles/MainActivity.kt || true
          sed -i 's/UsbMassStorageBlockDevice(manager, device)/UsbMassStorageBlockDevice(this, manager, device)/g' app/src/main/java/com/otgfiles/MainActivity.kt || true

          find . -maxdepth 6 -exec touch {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Fetch ntfs-3g source
        run: |
          mkdir -p app/src/main/cpp/ntfs-3g-src
          curl -L https://github.com/tuxera/ntfs-3g/archive/refs/tags/2022.10.3.tar.gz -o ntfs-3g.tar.gz
          tar -xzf ntfs-3g.tar.gz --strip-components=1 -C app/src/main/cpp/ntfs-3g-src
          rm ntfs-3g.tar.gz

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtgFiles-SamsungUI-APK
          path: app/build/outputs/apk/release/*.apk
