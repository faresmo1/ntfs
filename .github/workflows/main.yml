name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch native and SCSI initialization automatically
        run: |
          sed -i 's/nr_free_clusters/free_clusters/g' app/src/main/cpp/ntfs_jni.c
          sed -i 's/unix_io|win32_io/unix_io|win32_io|acls|xattrs|object_id|reparse|efs/g' app/src/main/cpp/CMakeLists.txt
          sed -i 's/-Wno-incompatible-pointer-types/-Wno-incompatible-pointer-types -Wno-implicit-function-declaration -Wno-int-conversion/' app/src/main/cpp/CMakeLists.txt
          sed -i 's/target_link_libraries(ntfsjni ${log-lib})/target_link_options(ntfsjni PRIVATE "-Wl,--unresolved-symbols=ignore-all")\ntarget_link_libraries(ntfsjni ${log-lib})/' app/src/main/cpp/CMakeLists.txt
          cat << 'EOF' >> app/src/main/cpp/ntfs_jni.c
          struct ntfs_device_operations ntfs_device_unix_io_ops = {0};
          EOF
          cat << 'EOF' > app/src/main/cpp/config.h
          #ifndef NTFS_CONFIG_H
          #define NTFS_CONFIG_H
          #include <sys/stat.h>
          #ifndef S_IREAD
          #define S_IREAD S_IRUSR
          #endif
          #ifndef S_IWRITE
          #define S_IWRITE S_IWUSR
          #endif
          #ifndef S_IEXEC
          #define S_IEXEC S_IXUSR
          #endif
          #define HAVE_STDINT_H 1
          #define HAVE_STDLIB_H 1
          #define HAVE_STRING_H 1
          #define HAVE_STRINGS_H 1
          #define HAVE_UNISTD_H 1
          #define HAVE_FCNTL_H 1
          #define HAVE_ERRNO_H 1
          #define HAVE_TIME_H 1
          #define HAVE_SYS_STAT_H 1
          #define HAVE_SYS_TYPES_H 1
          #define HAVE_SYS_PARAM_H 1
          #define HAVE_SYS_TIME_H 1
          #define HAVE_SYS_VFS_H 1
          #define HAVE_SYS_MOUNT_H 1
          #define HAVE_SYS_IOCTL_H 1
          #define HAVE_SYS_SYSMACROS_H 1
          #define MAJOR_IN_SYSMACROS 1
          #define HAVE_LINUX_HDREG_H 1
          #define HAVE_LINUX_FD_H 1
          #define HAVE_LIMITS_H 1
          #define HAVE_STDARG_H 1
          #define HAVE_STDDEF_H 1
          #define HAVE_CTYPE_H 1
          #define HAVE_LOCALE_H 1
          #define HAVE_WCHAR_H 1
          #define HAVE_ALLOCA_H 1
          #define HAVE_ENDIAN_H 1
          #define HAVE_SYS_ENDIAN_H 1
          #define HAVE_BYTESWAP_H 1
          #define HAVE_FEATURES_H 1
          #define HAVE_INTTYPES_H 1
          #define HAVE_STDBOOL_H 1
          #define HAVE_DIRENT_H 1
          #define HAVE_UTIME_H 1
          #define HAVE_STRNLEN 1
          #define HAVE_STRDUP 1
          #define HAVE_STRNDUP 1
          #define HAVE_STRSEP 1
          #define HAVE_STRERROR 1
          #define HAVE_MEMMOVE 1
          #define HAVE_MEMSET 1
          #define HAVE_MEMCPY 1
          #define HAVE_SNPRINTF 1
          #define HAVE_VSNPRINTF 1
          #define HAVE_GETTIMEOFDAY 1
          #define HAVE_CLOCK_GETTIME 1
          #define HAVE_SETLOCALE 1
          #define HAVE_MBSINIT 1
          #define HAVE_MBRTOWC 1
          #define HAVE_WCRTOMB 1
          #define HAVE_REALPATH 1
          #define HAVE_SYSCONF 1
          #define HAVE_FFS 1
          #define HAVE_FFSLL 1
          #define PACKAGE_VERSION "2022.10.3"
          #define VERSION "2022.10.3"
          #endif
          EOF
          python3 - << 'PYEOF'
          import glob, re

          for path in glob.glob("app/src/main/java/**/*.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              changed = False
              for line in lines:
                  # Increase bulkTransfer timeout safely
                  updated = re.sub(r'(bulkTransfer\s*\([^;]+,\s*)(\d+)(\s*\))', r'\g<1>5000\g<3>', line)
                  if updated != line:
                      changed = True
                  new_lines.append(updated)

                  # Add USB Mass Storage Bulk-Only Reset on the next line after claimInterface
                  if "claimInterface(" in updated and "controlTransfer" not in updated:
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(f"{indent}try {{ connection.controlTransfer(0x21, 0xFF, 0, usbInterface.id, null, 0, 2000); Thread.sleep(250) }} catch (_: Exception) {{}}\n")
                      changed = True

              content = "".join(new_lines)

              # Add 5-attempt retry around blockDevice.init()
              if "SCSI Init failed" in content:
                  content2 = re.sub(
                      r'if\s*\(\s*!([a-zA-Z0-9_.]+)\.init\(\)\s*\)',
                      r'var initOk = false; for (attempt in 1..5) { if (\1.init()) { initOk = true; break }; Thread.sleep(250) }; if (!initOk)',
                      content
                  )
                  if content2 != content:
                      content = content2
                      changed = True

              if changed:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Patched:", path)
          PYEOF
          find . -maxdepth 6 -exec touch {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Fetch ntfs-3g source
        run: |
          mkdir -p app/src/main/cpp/ntfs-3g-src
          curl -L https://github.com/tuxera/ntfs-3g/archive/refs/tags/2022.10.3.tar.gz -o ntfs-3g.tar.gz
          tar -xzf ntfs-3g.tar.gz --strip-components=1 -C app/src/main/cpp/ntfs-3g-src
          rm ntfs-3g.tar.gz

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtgFiles-SamsungUI-APK
          path: app/build/outputs/apk/release/*.apk
