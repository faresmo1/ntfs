                  return try {
                      val devices = UsbMassStorageDevice.getMassStorageDevices(context)
                      val target = devices.firstOrNull { it.usbDevice.deviceId == usbDevice.deviceId }
                          ?: devices.firstOrNull()
                          ?: return false

                      target.init()
                      massStorageDevice = target

                      val partitions = target.partitions
                      if (partitions.isNotEmpty()) {
                          val part = partitions.first()
                          blockDevice = part
                          blockSize = part.blockSize
                          partitionOffsetBytes = 0L
                          true
                      } else {
                          false
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }

              @Synchronized
              fun readSectors(lba: Long, count: Int): ByteArray? {
                  val driver = blockDevice ?: return null
                  return try {
                      val buf = ByteBuffer.allocate(count * blockSize)
                      driver.read(lba, buf)
                      buf.array()
                  } catch (e: Exception) {
                      null
                  }
              }

